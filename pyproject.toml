[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-stream-ai"
version = "1.0.0"
description = "Ultra-Low-Resource Edge Computer Vision & Multimodal Event Engine"
authors = [
    { name = "Abenezer (Susan)", email = "contact@satiralabs.com" }
]
readme = "README.md"
requires-python = ">=3.8"
keywords = ["edge-cv", "computer-vision", "motion-detection", "iot", "embedded-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
]

[project.scripts]
edge-stream-ai = "edge_stream.cli:main"
